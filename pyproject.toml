[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow-mcp"
version = "0.1.0"
description = "MCP Server for Docflow document automation platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "docflow-sdk @ git+https://github.com/yuksin-lei/docflow-sdk.git",
]

[project.scripts]
docflow-mcp = "docflow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["docflow_mcp"]
